name: Build Portable mpv

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Download mpv (dyphire/mpv-winbuild)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "mpv-x86_64-*.7z" -and $_.name -notlike "*-v3-*" -and $_.name -notlike "mpv-dev-*" } | Select-Object -First 1
          Write-Output "Downloading mpv: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv.7z"
          New-Item -ItemType Directory -Path "mpv-portable" -Force | Out-Null
          7z x "mpv.7z" -o"mpv-portable" -aoa

      - name: Download FFmpeg (from same release)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "ffmpeg-x86_64-*.7z" -and $_.name -notlike "*-v3-*" } | Select-Object -First 1
          Write-Output "Downloading ffmpeg: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "ffmpeg.7z"
          7z x "ffmpeg.7z" -o"mpv-portable" -aoa

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "yt-dlp.exe" } | Select-Object -First 1
          Write-Output "Downloading yt-dlp: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mpv-portable\yt-dlp.exe"

      - name: Assemble portable_config
        shell: pwsh
        run: |
          $customRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/JiayuYangX/mpv-custom/releases/latest"
          $configAsset = $customRelease.assets | Where-Object { $_.name -like "mpv-custom*.zip" } | Select-Object -First 1
          Write-Output "Downloading config: $($configAsset.name)"
          Invoke-WebRequest -Uri $configAsset.browser_download_url -OutFile "mpv-config.zip"
          7z x "mpv-config.zip" -o"mpv-portable" -aoa
          $confPath = "mpv-portable\portable_config\mpv.conf"
          (Get-Content $confPath) -replace 'geometry=.*', 'geometry=1600x900' | Set-Content $confPath

      - name: Sync bat files from MpvCustomz
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/yudong2ao/MpvCustomz.git
          Copy-Item -Path "MpvCustomz\mpv-*.bat" -Destination "mpv-portable" -Force -Recurse
          Remove-Item "MpvCustomz" -Recurse -Force
          
      - name: Create zip archive
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd"
          Compress-Archive -Path "mpv-portable\*" -DestinationPath "mpv-config-bundle-$timestamp.zip"
          echo "TIMESTAMP=$timestamp" >> $env:GITHUB_ENV
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          TIMESTAMP: ${{ env.TIMESTAMP }}
        with:
          tag_name: ${{ env.TIMESTAMP }}
          files: mpv-config-bundle-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
