name: Download and Compress Hugging Face Model

on:
  workflow_dispatch:  # 手动触发

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install huggingface-hub
      
      - name: Download model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              'chickenrice0721/whisper-large-v2-translate-zh-v0.2-st-ct2',
              cache_dir='./models',
              local_dir='./models/whisper-model'
          )
          "
      
      - name: Install 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      
      - name: Compress model with 7z
        run: |
          cd models
          7z a -mx=5 -v1536m whisper-model.7z whisper-model/
          ls -lh whisper-model.7z*
      
      - name: Upload compressed model as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-compressed
          path: models/whisper-model.7z*
          retention-days: 30
